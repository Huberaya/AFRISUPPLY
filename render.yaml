# Blueprint Render — API AFRISUPPLY (Hono / Node 20) branchée sur Neon.
# Dashboard Render → New → Blueprint → ce dépôt. Renseigner ensuite les variables marquées sync:false.
services:
  - type: web
    name: afrisupply-api
    runtime: node
    region: frankfurt           # au plus près de Neon eu-central-1
    plan: starter               # « free » possible pour un pilote (mise en veille après 15 min → cron plus lent)
    rootDir: .
    buildCommand: npm ci && npm run typecheck -w packages/db -w apps/api
    startCommand: npm run start -w apps/api
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8787
      - key: AUTO_MIGRATE
        value: "true"
      - key: SEED_DEMO
        value: "false"
      - key: DATABASE_URL
        sync: false             # chaîne Neon « pooler » (…-pooler…neon.tech/neondb?sslmode=require)
      - key: JWT_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: APP_URL
        sync: false             # URL Vercel du site, ex. https://afrisupply.vercel.app
      - key: ADMIN_EMAILS
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        value: AFRISUPPLY <bonjour@afrisupply.fr>
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://api.openai.com/v1
      - key: LLM_MODEL
        value: gpt-4o-mini
